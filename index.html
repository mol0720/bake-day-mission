<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>출근부터 퇴근까지! 하루 미션 · Bake Your Dream 2026</title>
<style>
:root{--navy:#0B3D5C;--coral:#E98A5B;--orange:#EE731D;--blue:#096498;--pale:#FBF1EB;--paleb:#EAF2F7;--ok:#1E7B4F;--fs:21px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;word-break:keep-all;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--pale);color:#1F2937;font-size:var(--fs);line-height:1.5}
body.big{--fs:26px}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:12px 14px 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--navy);color:#fff;border-radius:16px;padding:10px 14px}
.top .clock{font-weight:800;font-size:1.05em}
.top .st{font-weight:800;background:#fff;color:var(--navy);border-radius:999px;padding:2px 12px}
.bar{height:12px;background:#E3D6CC;border-radius:99px;margin:10px 2px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--orange));width:0;transition:width .4s}
.card{background:#fff;border-radius:20px;padding:18px 16px;box-shadow:0 3px 10px rgba(11,61,92,.12);margin-top:6px}
.tag{display:inline-block;background:var(--coral);color:#fff;font-weight:800;border-radius:10px;padding:2px 12px;font-size:.8em}
.emoji{font-size:64px;text-align:center;line-height:1.2;margin:6px 0}
h1{color:var(--navy);font-size:1.45em;margin:6px 0;line-height:1.3}
h2{color:var(--navy);font-size:1.15em;margin:8px 0 4px}
.sit{font-size:1.05em;margin:4px 0 8px}
.bubble{background:var(--paleb);border-left:6px solid var(--blue);border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:700}
.q{font-weight:800;color:var(--navy);margin:12px 0 6px}
.btn{display:block;width:100%;min-height:68px;margin:10px 0;padding:12px 14px;border:3px solid var(--navy);background:#fff;color:var(--navy);border-radius:16px;font:inherit;font-weight:700;text-align:left;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--coral);border-color:var(--coral);color:#fff;text-align:center;font-size:1.15em}
.btn.sub{background:var(--paleb);border-color:var(--paleb);text-align:center}
.btn.right{background:#E3F4EA;border-color:var(--ok);color:var(--ok)}
.btn.wrong{background:#F3F4F6;border-color:#9CA3AF;color:#6B7280}
.btn.sel{background:var(--navy);color:#fff}
.btn[disabled]{opacity:.95}
.row{display:flex;gap:10px}.row .btn{flex:1;text-align:center}
.sig{display:flex;gap:8px;margin:10px 0}
.sig .btn{text-align:center;color:#fff;border:none;font-size:.95em;min-height:100px;padding:8px 4px;margin:0}
.s-stop{background:var(--coral)!important}.s-call{background:var(--orange)!important}.s-speak{background:var(--navy)!important}
.sig .btn.done{opacity:.35}
.seq{min-height:40px;font-weight:800;color:var(--navy)}
.fb{border-radius:16px;padding:14px;margin-top:10px;font-weight:700}
.fb.good{background:#E3F4EA;color:#14532D;border:3px solid var(--ok)}
.fb.try{background:#FFF4E5;color:#7C2D12;border:3px solid var(--orange)}
.say{font-size:.75em;padding:4px 10px;border-radius:10px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;cursor:pointer;float:right;font-family:inherit}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stamps div{aspect-ratio:1;border:3px dashed var(--coral);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:#fff}
.stamps div.on{border-style:solid;background:var(--pale)}
.cert{border:5px double var(--coral);border-radius:18px;padding:16px;text-align:center;background:#fff}
.code{font-size:1.4em;font-weight:900;letter-spacing:2px;color:var(--blue)}
input{width:100%;font:inherit;padding:12px;border:3px solid var(--navy);border-radius:14px;margin:6px 0}
.foot{font-size:.62em;color:#5B6470;text-align:center;margin-top:14px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top"><span class="clock" id="clock">☀️ 하루 미션</span><span class="st" id="st">🍞 0</span></div>
  <div class="bar"><i id="bar"></i></div>
  <main id="app" aria-live="polite"></main>
  <div class="foot">Bake Your Dream 2026 · 거제대학교 조리제빵과 특수교육트랙 취업캠프<br>2025 캠프 「함께 일하기」·「위기 속의 나」 자료를 바탕으로 만들었어요 · 사)경남사회문화교육센터</div>
</div>
<script>
const M=[
 {t:'08:00',e:'🚌',tag:'출근길',sit:'버스가 늦게 와요. 8시 30분까지 도착하기 어려울 것 같아요.',q:'어떻게 할까요?',c:[
   ['📞 점장님께 먼저 전화해요. “버스가 늦어서 10분 늦을 것 같습니다.”',1],['🤐 아무 말 없이 늦게 가요.',0],['🏠 그냥 집에 돌아가요.',0]],
   ok:'좋아요! 늦을 것 같으면 먼저 알려요. 제빵사는 시간을 잘 지켜요.',hint:'회사는 내가 어디 있는지 몰라서 걱정해요. 먼저 알려 주면 좋아요.'},
 {t:'08:30',e:'👋',tag:'출근',sit:'가게에 도착했어요. 점장님이 계세요.',q:'처음에 무엇을 할까요?',c:[
   ['😊 밝은 목소리로 “좋은 아침입니다!”',1],['📱 휴대폰을 보며 그냥 들어가요.',0],['🙈 고개를 숙이고 지나가요.',0]],
   ok:'최고예요! 밝은 목소리로 인사하면 하루가 즐거워요.',hint:'만나면 먼저 무엇을 하나요? 인사를 해요!'},
 {t:'08:40',e:'🧼',tag:'위생',type:'multi',sit:'일을 시작하기 전이에요.',q:'해야 할 것을 모두 고르고 [다 골랐어요]를 눌러요.',c:[
   ['🧼 손을 깨끗이 씻어요',1],['🧢 위생모를 써요',1],['👕 앞치마를 입어요',1],['📱 휴대폰을 보며 반죽해요',0]],
   ok:'완벽해요! 깨끗한 손, 위생모, 앞치마. 이제 빵을 만들 수 있어요.',hint:'빵은 손님이 먹는 음식이에요. 깨끗하게 준비하는 것을 모두 골라요.'},
 {t:'09:00',e:'🚦',tag:'신호등 보고법',type:'signal',sit:'점장님께 말하는 방법, 신호등 보고법을 기억해요?',q:'순서대로 눌러요!',
   ok:'정답! ① 멈춰요(STOP) → ② 불러요(CALL) → ③ 말해요(SPEAK)',hint:'처음에는 하던 일을 멈춰요. 그다음 “점장님!” 불러요. 마지막에 말해요.'},
 {t:'10:00',e:'🔥',tag:'빵이 탔어요',sit:'오븐을 열었더니 빵이 조금 탔어요.',q:'어떻게 할까요?',c:[
   ['🗣️ “점장님! 죄송합니다. 빵이 조금 탔습니다.”',1],['🗑️ 몰래 버리고 숨겨요.',0],['😶 모른 척해요.',0]],
   ok:'용감해요! 몰래 버리거나 숨기지 않아요. 불이 날 수도 있으니 꼭 말해요.',hint:'신호등 보고법! 멈추고 → 부르고 → 솔직하게 말해요.'},
 {t:'10:30',e:'♨️',tag:'안전',sit:'뜨거운 오븐 팬을 들고 동료 뒤로 지나가야 해요.',q:'뭐라고 말할까요?',c:[
   ['📢 “뜨거운 거 지나갑니다!”',1],['🤫 조용히 빨리 지나가요.',0],['🏃 뛰어서 지나가요.',0]],
   ok:'안전 최고! 주방은 좁고 위험해요. 지나갈 때는 꼭 말해요.',hint:'부딪히면 위험해요. 동료가 알 수 있게 말해요.'},
 {t:'11:00',e:'🍽️',tag:'접시가 깨졌어요',sit:'쨍그랑! 접시가 바닥에 떨어져 깨졌어요.',q:'어떻게 할까요?',c:[
   ['✋ 그 자리에 멈추고 “점장님! 접시가 깨졌습니다! 다치지 않았습니다!”',1],['🖐️ 손으로 빨리 주워요.',0],['🦶 발로 밀어서 숨겨요.',0]],
   ok:'잘했어요! 손으로 줍지 않아요. 다칠 수 있어요. 큰 소리로 알려요.',hint:'깨진 접시는 손을 다치게 해요. 멈추고, 점장님을 불러요.'},
 {t:'13:00',e:'🧅',tag:'일을 다 끝냈어요',sit:'양파 썰기를 다 끝냈어요.',q:'이제 무엇을 할까요?',c:[
   ['🙋 “점장님! 양파 썰기 다 끝났습니다. 다음은 무엇을 할까요?”',1],['🧍 멍하니 서 있어요.',0],['📱 휴대폰 게임을 해요.',0]],
   ok:'멋져요! 멍하니 서 있지 말고 다음 일을 물어봐요.',hint:'일이 끝나면 점장님께 알리고 다음 일을 물어봐요.'},
 {t:'14:00',e:'🩹',tag:'다쳤어요',sit:'칼질을 하다가 손을 조금 베였어요.',q:'어떻게 할까요?',c:[
   ['🗣️ “손을 베였습니다. 치료하고 와도 되겠습니까?”',1],['😣 아파도 참고 계속 일해요.',0],['🚪 말없이 집에 가요.',0]],
   ok:'맞아요! 참으면 안 돼요. 아픈 몸으로 요리하면 위생에도 좋지 않아요.',hint:'아플 때는 참지 않아요. 점장님께 말해요.'},
 {t:'15:00',e:'📦',tag:'위기 상황',sit:'바쁜 시간, 점장님이 큰 소리로 말해요.',say:'“이렇게 잘못 포장하면 어떻게 해!”',q:'뭐라고 대답할까요?',c:[
   ['🙇 “죄송합니다. 바로 다시 포장하겠습니다.”',1],['😠 “왜 소리 질러요!” 화를 내요.',0],['😭 울면서 밖으로 나가요.',0]],
   ok:'침착하게 잘했어요! 실수는 누구나 해요. 바로 고치면 돼요.',hint:'먼저 사과하고, 바로 고친다고 말해요.'},
 {t:'16:00',e:'🧑‍🍳',tag:'손님 응대',sit:'손님이 오래 기다려서 화가 났어요.',say:'“도대체 언제 나오는 거예요?”',q:'뭐라고 말할까요?',c:[
   ['🙏 “기다리게 해서 정말 죄송합니다. 바로 확인해서 빨리 준비해 드리겠습니다.”',1],['🙄 “저도 바빠요.”',0],['🙉 못 들은 척해요.',0]],
   ok:'훌륭해요! 사과하고, 바로 확인하겠다고 말해요.',hint:'손님 마음을 먼저 알아줘요. “죄송합니다”로 시작해요.'},
 {t:'17:00',e:'🌇',tag:'퇴근',sit:'오늘 일이 모두 끝났어요.',q:'집에 가기 전에 무엇을 할까요?',c:[
   ['😊 “오늘 수고하셨습니다! 내일 뵙겠습니다.”',1],['🚪 말없이 나가요.',0],['🎧 이어폰을 끼고 그냥 가요.',0]],
   ok:'완벽한 하루! 인사로 시작하고 인사로 끝나요.',hint:'출근할 때처럼, 퇴근할 때도 인사해요.'}
];
let S={i:-1,stamps:0,stars:0,tries:0,name:'',sound:true,voice:false};
const $=id=>document.getElementById(id), app=$('app');
function beep(good){ if(!S.sound) return; try{const a=new (window.AudioContext||window.webkitAudioContext)();
  (good?[523,659,784]:[330,262]).forEach((f,k)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(.15,a.currentTime+k*.13);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+k*.13+.25);o.start(a.currentTime+k*.13);o.stop(a.currentTime+k*.13+.26)});}catch(e){} }
function speak(t){ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,'')); u.lang='ko-KR'; u.rate=.9; speechSynthesis.speak(u); }
function hud(){ $('st').textContent='🍞 '+S.stamps+(S.stars?'  ⭐ '+S.stars:''); $('bar').style.width=(Math.max(0,S.i)/M.length*100)+'%'; }
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
  app.innerHTML=`<div class="card"><div class="emoji">🥐🏪</div><h1>출근부터 퇴근까지!<br>하루 미션</h1>
  <p class="sit">오늘 나는 빵집 직원이에요.<br>12개 미션을 하고 <b>빵 도장 🍞</b>을 모아요!</p>
  <p class="q">별명을 적어요 (이름 대신)</p><input id="nm" maxlength="8" placeholder="예) 크루아상">
  <button class="btn main" id="go">▶ 시작하기</button>
  <div class="row"><button class="btn sub" id="bg">🔍 글씨 크게</button><button class="btn sub" id="vo">🔊 읽어주기 끄기</button></div>
  <div class="row"><button class="btn sub" id="so">🎵 효과음 켜짐</button></div></div>`;
  $('vo').textContent=S.voice?'🔊 읽어주기 켜짐':'🔈 읽어주기 꺼짐';
  $('go').onclick=()=>{S.name=($('nm').value||'제빵사').trim().slice(0,8);S.i=0;S.stamps=0;S.stars=0;show()};
  $('bg').onclick=()=>document.body.classList.toggle('big');
  $('vo').onclick=()=>{S.voice=!S.voice;$('vo').textContent=S.voice?'🔊 읽어주기 켜짐':'🔈 읽어주기 꺼짐'; if(S.voice) speak('읽어주기를 켰어요')};
  $('so').onclick=()=>{S.sound=!S.sound;$('so').textContent=S.sound?'🎵 효과음 켜짐':'🔇 효과음 꺼짐'};
  hud();
}
function show(){
  const m=M[S.i]; S.tries=0; hud(); $('clock').textContent='🕘 '+m.t+'  ('+(S.i+1)+'/'+M.length+')';
  let h=`<div class="card"><span class="tag">미션 ${S.i+1} · ${m.tag}</span><button class="say" id="sp">🔊 듣기</button>
  <div class="emoji">${m.e}</div><p class="sit">${m.sit}</p>${m.say?`<div class="bubble">${m.say}</div>`:''}<p class="q">${m.q}</p><div id="ch"></div><div id="fb"></div></div>`;
  app.innerHTML=h; const read=m.sit+' '+(m.say||'')+' '+m.q; $('sp').onclick=()=>speak(read+' '+(m.c?m.c.map((c,k)=>(k+1)+'번, '+c[0]).join('. '):'')); if(S.voice) speak(read);
  const ch=$('ch');
  if(m.type==='signal'){
    const order=['stop','call','speak'], lab={stop:'✋<br>멈춰요<br>STOP',call:'📣<br>불러요<br>CALL',speak:'💬<br>말해요<br>SPEAK'}; let got=[];
    ch.innerHTML='<div class="sig">'+shuffle(order).map(k=>`<button class="btn s-${k}" data-k="${k}">${lab[k]}</button>`).join('')+'</div><div class="seq" id="seq">순서: </div>';
    ch.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{ if(b.classList.contains('done')) return; const k=b.dataset.k;
      if(k===order[got.length]){got.push(k);b.classList.add('done');$('seq').textContent='순서: '+got.map(x=>({stop:'멈춰요',call:'불러요',speak:'말해요'})[x]).join(' → '); beep(true);
        if(got.length===3) win(m);} else {S.tries++; beep(false); tryAgain(m); got=[]; ch.querySelectorAll('.btn').forEach(x=>x.classList.remove('done')); $('seq').textContent='순서: ';}});
  } else if(m.type==='multi'){
    const opts=shuffle(m.c); ch.innerHTML=opts.map((c,k)=>`<button class="btn" data-k="${k}">${c[0]}</button>`).join('')+'<button class="btn main" id="done">✅ 다 골랐어요</button>';
    const sel=new Set(); ch.querySelectorAll('.btn[data-k]').forEach(b=>b.onclick=()=>{const k=+b.dataset.k; sel.has(k)?sel.delete(k):sel.add(k); b.classList.toggle('sel')});
    $('done').onclick=()=>{ const ok=opts.every((c,k)=>(c[1]===1)===sel.has(k)); if(ok) win(m); else {S.tries++; beep(false); tryAgain(m);} };
  } else {
    const opts=shuffle(m.c); ch.innerHTML=opts.map((c,k)=>`<button class="btn" data-k="${k}">${c[0]}</button>`).join('');
    ch.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{ const c=opts[+b.dataset.k];
      if(c[1]){ b.classList.add('right'); ch.querySelectorAll('.btn').forEach(x=>x.disabled=true); win(m);} else { S.tries++; b.classList.add('wrong'); b.disabled=true; beep(false); tryAgain(m);} });
  }
}
function tryAgain(m){ $('fb').innerHTML=`<div class="fb try">💛 괜찮아요! 다시 골라 볼까요?<br><small>힌트: ${m.hint}</small></div>`; if(S.voice) speak('괜찮아요. 다시 골라 볼까요? '+m.hint); }
function win(m){
  S.stamps++; const star=S.tries===0; if(star) S.stars++; beep(true); hud();
  $('fb').innerHTML=`<div class="fb good">🎉 딩동댕! 빵 도장 🍞 1개${star?' + 한 번에 성공 ⭐':''}<br>${m.ok}</div><button class="btn main" id="nx">${S.i<M.length-1?'다음 미션 ▶':'퇴근하기 🌇'}</button>`;
  if(S.voice) speak('딩동댕! '+m.ok); $('nx').onclick=()=>{S.i++; S.i<M.length?show():end()}; $('nx').scrollIntoView({behavior:'smooth',block:'center'});
}
function end(){
  S.i=M.length; hud(); $('clock').textContent='🌇 퇴근 완료!';
  const code='BYD-'+String(S.stamps).padStart(2,'0')+String(S.stars).padStart(2,'0');
  const msg=S.stars>=10?'한 번에 척척! 최고의 제빵사예요!':S.stars>=6?'아주 잘했어요! 내일은 더 잘할 수 있어요!':'끝까지 해낸 것이 정말 멋져요!';
  app.innerHTML=`<div class="card"><div class="cert"><div class="emoji">🏅</div><h1>오늘의 멋진 제빵사</h1><h2>${S.name.replace(/[<>&]/g,'')} 님</h2>
  <div class="stamps">${M.map((_,k)=>`<div class="${k<S.stamps?'on':''}">${k<S.stamps?'🍞':''}</div>`).join('')}</div>
  <p class="sit">빵 도장 <b>${S.stamps}개</b> · 한 번에 성공 <b>⭐ ${S.stars}개</b><br>${msg}</p>
  <p class="q">선생님께 이 화면을 보여 주세요!</p><div class="code">${code}</div><p class="sit"><small>워크북 24쪽 도장판에 도장을 받아요</small></p></div>
  <button class="btn main" id="re">🔁 처음부터 다시 하기</button></div>`;

}

// 미리보기용: 주소 끝에 #m5 (미션 5), #m5w (오답 피드백), #m5ok (정답 피드백), #end (결과)
(function(){const h=location.hash; if(!h) return; S.name='크루아상'; S.sound=false;
 let m=h.match(/^#m(\d+)(w|ok)?$/); if(m){S.i=+m[1]-1;S.stamps=S.i;S.stars=Math.max(0,S.i-1);show();
   if(m[2]==='w'){const b=[...document.querySelectorAll('#ch .btn')].find(b=>!M[S.i].c||M[S.i].c.some(c=>c[0]===b.textContent&&!c[1])); b&&b.click();}
   if(m[2]==='ok'){const b=[...document.querySelectorAll('#ch .btn')].find(b=>M[S.i].c.some(c=>c[0]===b.textContent&&c[1])); b&&b.click();}}
 if(h==='#end'){S.stamps=12;S.stars=9;end();}})();
